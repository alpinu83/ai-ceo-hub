# LiteLLM Open-Source AI Gateway Configuration
# Connects free Gemini tier, Gemini 4 Neon, Claude, OpenRouter free models, and local Ollama
# Docs: https://github.com/BerriAI/litellm

model_list:
  - model_name: gemini-free
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-4-neon
    litellm_params:
      model: gemini/gemini-4-neon
      api_key: os.environ/GEMINI_API_KEY

  - model_name: claude-lead
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: openrouter-free
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: ollama-local
    litellm_params:
      model: ollama/qwen2.5:14b
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  max_budget: 50.0 # USD monthly safety cap
  budget_duration: 30d
