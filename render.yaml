services:
  - type: web
    name: ai-ceo-hub
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3456
      - key: NODE_ENV
        value: production
      - key: EXAONE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_POLLING
        value: "true"
      - key: GITHUB_GIST_TOKEN
        sync: false
      - key: GIST_BACKUP_ID
        sync: false
      - key: CEO_ADMIN_KEY
        sync: false
