name: Keep Render Server Warm (Anti-Sleep for Pickle/Cue/Muse)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health
        run: |
          curl -fsS -m 60 https://ai-ceo-hub.onrender.com/api/health
          echo ""
