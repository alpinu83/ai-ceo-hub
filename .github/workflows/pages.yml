name: Deploy CEO Office to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install open-source dependencies
        run: npm ci

      - name: Assemble static bundle with open-source vendor libraries
        run: |
          mkdir -p dist/vendor dist/exports
          cp -r public/* dist/
          cp node_modules/marked/lib/marked.umd.js dist/vendor/marked.umd.js
          cp node_modules/lucide/dist/umd/lucide.min.js dist/vendor/lucide.min.js
          cp litellm_config.yaml dist/exports/litellm.txt
          cp docker-compose.yml dist/exports/docker-compose.txt
          cp railway.json dist/exports/railway.txt
          cp render.yaml dist/exports/render.txt
          touch dist/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
