name: CI — AI CEO Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all server & client modules
        run: |
          node --check server.js
          node --check src/store.js
          node --check src/orchestrator.js
          node --check src/mcp.js
          node --check src/telegram.js
          node --check public/app.js

      - name: Run E2E API, MCP SDK & Telegram Bot tests
        run: npm test
